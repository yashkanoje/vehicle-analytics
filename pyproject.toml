[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-analytics"
version = "0.1.0"
description = "Local traffic analytics: vehicle counting and speed estimation with uncertainty from fixed-camera video"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Yash Kanoje" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
    "ultralytics>=8.3",
    "deep-sort-realtime>=1.3.2",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "scipy>=1.11", "pypdf>=4.0"]
dashboard = ["streamlit>=1.40", "pandas>=2.0"]

[project.scripts]
vehicle-analytics = "vehicle_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vehicle_analytics = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
